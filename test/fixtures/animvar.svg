<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .hub { fill: #1B4D3E; }
    @media (prefers-reduced-motion: no-preference) {
      .hub { animation: tint var(--beat) infinite; }
      @keyframes tint { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
    }
  </style>
  <circle class="hub" cx="32" cy="32" r="18"/>
</svg>
