<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>@keyframes fade { 0%,100% { opacity:.9 } 50% { opacity:.4 } }</style>
  <rect x="12" y="12" width="40" height="40" rx="8" fill="#334E68"
        style="animation:fade 2s infinite;opacity:.9">
    <animate attributeName="rx" values="8;20;8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="32" cy="32" r="7" fill="#F0B429"/>
</svg>
